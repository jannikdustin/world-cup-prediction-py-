name: WM 2026 Value Monitor

on:
  schedule:
    # 1x taeglich um 01:00 UTC = 02:00 Uhr MEZ (Winter) / 03:00 Uhr MESZ (Sommer) --
    # bewusst nachts, damit neu erschienene Spiele/Turniere zuverlaessig VOR dem
    # naechsten Lauf zum ersten Mal gesehen werden und Bankroll-Wetten garantiert
    # nur einmal pro Tag und pro Spiel platziert werden (kein zweiter Lauf am
    # selben Tag, der noch mal draufschauen und ggf. doppelt buchen koennte).
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # erlaubt manuellen Start ueber den "Run workflow" Button

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: WM-Quoten abrufen
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python value_monitor/fetch_odds.py

      - name: WM Value-Scan ausfuehren
        run: python value_monitor/run_value_scan.py

      - name: Klub-Quoten abrufen (Top 5 Ligen + Europa)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python value_monitor/fetch_odds_clubs.py

      - name: Klub Value-Scan ausfuehren (clubelo.com)
        run: python value_monitor/run_value_scan_clubs.py

      - name: Tennis-Quoten abrufen (aktive Turniere)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python value_monitor/fetch_odds_tennis.py

      - name: Tennis Value-Scan ausfuehren (Elo aus TennisMyLife-Daten)
        run: python value_monitor/run_value_scan_tennis.py

      - name: Faellige Wetten abrechnen (Bankroll-Tracker)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python value_monitor/settle_bets.py

      - name: Kombiniertes Dashboard bauen
        run: python value_monitor/generate_combined_dashboard.py

      - name: Dashboard fuer GitHub Pages vorbereiten
        run: |
          mkdir -p _site
          cp value_monitor/combined_dashboard.html _site/index.html

      - name: Bankroll-Ledger committen
        run: |
          git config user.name "value-monitor-bot"
          git config user.email "actions@github.com"
          git add value_monitor/ledger_*.json
          git diff --staged --quiet && echo "Keine Ledger-Aenderungen." || git commit -m "Bankroll-Ledger aktualisieren [skip ci]"
          git push

      - name: Pages Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
