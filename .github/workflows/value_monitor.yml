name: Value Monitor

on:
  schedule:
    # 1x taeglich um 01:00 UTC = 02:00 Uhr MEZ (Winter) / 03:00 Uhr MESZ (Sommer) --
    # bewusst nachts, damit neu erschienene Spiele/Turniere zuverlaessig VOR dem
    # naechsten Lauf zum ersten Mal gesehen werden und Bankroll-Wetten garantiert
    # nur einmal pro Tag und pro Spiel platziert werden (kein zweiter Lauf am
    # selben Tag, der noch mal draufschauen und ggf. doppelt buchen koennte).
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # erlaubt manuellen Start ueber den "Run workflow" Button

# WICHTIG: verhindert, dass zwei Laeufe gleichzeitig aktiv sind. Ohne das
# koennen zwei parallele Laeufe (z.B. manuell gestartet, waehrend der naechtliche
# Lauf noch aktiv ist) sich gegenseitig nicht sehen, beide "neue" Wetten
# eintragen und beim Zurueckschreiben ins Repo gegenseitig ueberschreiben --
# genau das hat die Bankroll-Dopplungen verursacht. cancel-in-progress: false
# heisst: ein neuer Trigger WARTET, bis der laufende Lauf fertig ist, statt
# ihn abzubrechen (damit keine bereits bezahlten API-Calls verschwendet werden).
concurrency:
  group: value-monitor
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Klub-Quoten abrufen (Top 5 Ligen + Europa)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python value_monitor/fetch_odds_clubs.py

      - name: Klub Value-Scan ausfuehren (clubelo.com)
        run: python value_monitor/run_value_scan_clubs.py

      - name: Tennis-Quoten abrufen (aktive Turniere)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python value_monitor/fetch_odds_tennis.py

      - name: Tennis Value-Scan ausfuehren (Elo aus TennisMyLife-Daten)
        run: python value_monitor/run_value_scan_tennis.py

      - name: Faellige Wetten abrechnen (Bankroll-Tracker)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python value_monitor/settle_bets.py

      - name: Kombiniertes Dashboard bauen
        run: python value_monitor/generate_combined_dashboard.py

      - name: Dashboard fuer GitHub Pages vorbereiten
        run: |
          mkdir -p _site
          cp value_monitor/combined_dashboard.html _site/index.html

      - name: Bankroll-Ledger committen
        run: |
          git config user.name "value-monitor-bot"
          git config user.email "actions@github.com"
          git add value_monitor/ledger_*.json
          git diff --staged --quiet && echo "Keine Ledger-Aenderungen." || git commit -m "Bankroll-Ledger aktualisieren [skip ci]"
          # Zusaetzliche Absicherung neben der concurrency-Sperre oben: falls doch
          # einmal ein anderer Commit zwischenzeitlich gepusht wurde, hier
          # dagegen rebasen statt den Push fehlschlagen zu lassen (und damit
          # unbemerkt einen aelteren Ledger-Stand stehen zu lassen).
          git pull --rebase origin HEAD || echo "Rebase nicht noetig/fehlgeschlagen, versuche Push trotzdem."
          git push

      - name: Pages Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Status-Datei schreiben und committen
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          HERE = "value_monitor"
          now = datetime.now(timezone.utc)
          today = now.date()

          # Robust gegen fehlende Ledger: eine nicht (mehr) vorhandene Datei
          # -- etwa nach dem Entfernen einer Pipeline wie der WM -- wird
          # uebersprungen statt den Job mit FileNotFoundError abzubrechen.
          # Neue Pipelines koennen hier einfach ergaenzt werden.
          LEDGERS = ("ledger_clubs.json", "ledger_tennis.json")

          count = 0
          for name in LEDGERS:
              path = os.path.join(HERE, name)
              if not os.path.exists(path):
                  print(f"Hinweis: {name} nicht vorhanden, wird uebersprungen.")
                  continue
              with open(path, encoding="utf-8") as f:
                  ledger = json.load(f)
              for bet in ledger.get("bets", []):
                  placed = bet.get("placed_at")
                  if placed and datetime.fromisoformat(placed).date() == today:
                      count += 1

          status = {
              "name": "Value Radar",
              "status": "aktiv",
              "last_run": now.isoformat(),
              "detail": f"{count} neue Value Bets gefunden",
          }
          with open("status.json", "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)
              f.write("\n")
          EOF
          git add status.json
          git commit -m "status.json aktualisieren [skip ci]"
          git push

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
